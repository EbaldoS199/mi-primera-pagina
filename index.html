<!-- Eliminar botón Limpiar datos -->

<script>
  const likesList = document.getElementById('namesList');
  const likesCount = document.getElementById('count');
  const commentsList = document.getElementById('commentsList');
  
  // Firestore referencias
  const likesCollection = db.collection('likes');
  const commentsCollection = db.collection('comments');

  // Escuchar likes en tiempo real
  likesCollection.onSnapshot(snapshot => {
    const likes = [];
    snapshot.forEach(doc => likes.push(doc.data()));
    likesCount.textContent = likes.length;
    likesList.innerHTML = '';
    likes.forEach((like, i) => {
      const div = document.createElement('div');
      div.textContent = `${like.name} (${new Date(like.timestamp.toDate()).toLocaleString()})`;
      likesList.appendChild(div);
    });
  });

  // Agregar like
  document.getElementById('likeBtn').addEventListener('click', () => {
    const name = prompt('Escribe tu nombre para dar like:');
    if(!name) return;
    likesCollection.add({
      name,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  });

  // Escuchar comentarios en tiempo real
  commentsCollection.orderBy('timestamp', 'desc').onSnapshot(snapshot => {
    commentsList.innerHTML = '';
    snapshot.forEach(doc => {
      const c = doc.data();
      const div = document.createElement('div');
      div.innerHTML = `<strong>${c.name}</strong>: ${c.text} <small>${new Date(c.timestamp.toDate()).toLocaleString()}</small>`;
      commentsList.appendChild(div);
    });
  });

  // Enviar comentario
  document.getElementById('commentBtn').addEventListener('click', () => {
    const nameInput = document.getElementById('cname');
    const textInput = document.getElementById('ctext');
    const name = nameInput.value.trim();
    const text = textInput.value.trim();
    if(!name || !text){
      alert('Ingresa nombre y comentario');
      return;
    }
    commentsCollection.add({
      name,
      text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    nameInput.value = '';
    textInput.value = '';
  });
</script>
