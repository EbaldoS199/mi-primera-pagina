<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Sierra</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{
      background: linear-gradient(135deg, #0a0f2c, #001f54);
      color:#fff; font-family: Arial, sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      height:100vh; margin:0; text-align:center;
    }
    h1{ font-size:3rem; color:#4ecdc4; margin-bottom:20px }
    p{ font-size:1.2rem; margin-bottom:40px }
    .btn{
      display:inline-block; padding:15px 30px; margin:10px; font-size:1.1rem; font-weight:700;
      border:none; border-radius:10px; cursor:pointer; transition:.3s; text-decoration:none;
    }
    .btn-login{ background:#f0f; color:#fff }
    .btn-login:hover{ background:#e60073 }
    .btn-register{ background:#4ecdc4; color:#fff }
    .btn-register:hover{ background:#39b9ad }
  </style>
</head>
<body>
  <h1>Bienvenidos al Mundo Web Sierra</h1>
  <p>Tu sitio web personal de desarrollo web y videojuegos</p>

  <div id="buttons">
    <a class="btn btn-login" href="login.html">Iniciar sesión</a>
    <a class="btn btn-register" href="create-profile.html">Registrarse</a>
  </div>

  <!-- Firebase (modular v10) -->
  <script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Si ya hay usuario logueado, redirige a presentación
        window.location.href = "presentacion.html";
      }
    });
  </script>
</body>
</html>
