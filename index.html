<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrias Sierra</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0f2c, #001f54);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            margin: 0;
        }
        h1 {
            font-size: 3rem;
            color: #4ecdc4;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        .btn {
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login {
            background-color: #fuchsia;
            color: white;
        }
        .btn-login:hover {
            background-color: #e60073;
        }
        .btn-register {
            background-color: #4ecdc4;
            color: white;
        }
        .btn-register:hover {
            background-color: #39b9ad;
        }
    </style>
</head>
<body>
    <h1>Bienvenidos al Mundo Web Sierra</h1>
    <p>Tu sitio web personal de desarrollo web y videojuegos</p>
    <div id="buttons">
        <a href="login.html"><button class="btn btn-login">Iniciar SesiÃ³n</button></a>
        <a href="registro.html"><button class="btn btn-register">Registrarse</button></a>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Verificar si hay un usuario logueado en Firebase
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                // Si ya hay usuario logueado, redirige a presentaciÃ³n
                window.location.href = "presentacion.html";
            }
        });
    </script>
</body>
</html>
