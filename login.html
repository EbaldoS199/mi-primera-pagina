<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Mi Primera Página</title>

  <!-- Fuente y estilos globales -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />

  <!-- Buenas prácticas de PWA/básicos -->
  <meta name="theme-color" content="#0a1624" />
  <meta name="description" content="Inicio de sesión — Proyecto Mi Primera Página de Ebaldo." />
</head>
<body>
  <noscript>
    <p style="padding:12px;background:#ffefef;color:#900;text-align:center">
      Necesitas habilitar JavaScript para usar el login.
    </p>
  </noscript>

  <!-- Partículas/efectos (opcional). Si no existe el CSS, no pasa nada. -->
  <div id="sparks" aria-hidden="true"></div>

  <!-- Lienzo principal -->
  <main class="hero">
    <!-- Bloques visuales opcionales para tu animación móvil.
         Si no usas imágenes, estos IDs pueden quedarse vacíos y no afectará. -->
    <img id="welcomeMobileImg" class="welcome" alt="Bienvenido" style="max-width:180px; height:auto;" />
    <div id="brandBlock" class="brand hide">mi-primera-página</div>

    <!-- Panel de login (alineado a tu maqueta) -->
    <section class="login-panel glass" style="max-width:380px; width:90%; padding:24px;">
      <header style="margin-bottom:12px">
        <h1 style="margin:0;font-size:1.4rem;font-weight:800">Iniciar sesión</h1>
        <p class="muted" style="margin:.25rem 0 0">Autenticación con Firebase</p>
      </header>

      <!-- Formulario con IDs que usa auth.js -->
      <form id="loginForm" autocomplete="on" style="display:grid;gap:12px">
        <label class="sr-only" for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email"
               placeholder="Email" required autocomplete="username" />

        <label class="sr-only" for="password">Contraseña</label>
        <input id="password" name="password" type="password"
               placeholder="Contraseña" required autocomplete="current-password" />

        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <a id="forgot" href="#" class="muted small">¿Olvidaste tu contraseña?</a>
          <button id="signInBtn" type="submit" class="btn">Entrar</button>
        </div>

        <p class="muted small" style="margin:4px 0 0">
          ¿No tienes cuenta?
          <a href="#" id="toSignUp">Crear cuenta</a>
        </p>

        <!-- Mensajes de estado accesibles -->
        <p id="authMessage" class="msg" role="status" aria-live="polite" style="min-height:1.2em"></p>
      </form>

      <!-- Accesos rápidos -->
      <footer style="margin-top:6px">
        <a class="small muted" href="./index.html">← Volver al inicio</a>
      </footer>
    </section>
  </main>

  <!-- Scripts ES Modules (usa SIEMPRE la misma versión en todos los imports) -->
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./auth.js"></script>

  <!-- Efectos/UI del login (opcional). Quita esta línea si aún no creas ui-login.js -->
  <script src="./ui-login.js" defer></script>
</body>
</html>
