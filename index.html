<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrias Sierra - Login</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="login-container">
        <h1 class="brand-title">
            <span class="special-s">S</span> Industrias Sierra
        </h1>
        <p class="welcome-text">Bienvenido a Industrias Sierra</p>

        <form class="login-form" onsubmit="return acceder()">
            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" placeholder="Escribe aquí tu nombre" id="username" required>
            </div>
            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" placeholder="Escribe aquí tu contraseña" id="password" required>
            </div>
            <button type="submit" class="login-btn">Acceder</button>
        </form>
    </div>
</body>
</html>
