<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Comunidad con Juego</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #1565c0 60%, #42a5f5 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    header {
        background: #333;
        color: #fff;
        padding: 10px;
        width: 100%;
        text-align: center;
    }
    header img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 10px;
    }
    .container {
        max-width: 900px;
        width: 100%;
        padding: 15px;
        background: white;
        margin-top: 15px;
        border-radius: 10px;
    }
    h2 { margin-top: 0; }
    .avatar-picker {
        display: grid;
        grid-template-columns: repeat(5, 60px);
        gap: 5px;
    }
    .avatar-picker div {
        width: 60px;
        height: 60px;
        background-image: url('avatares.png');
        background-size: cover;
        cursor: pointer;
        border: 2px solid transparent;
    }
    .avatar-picker div.selected {
        border-color: blue;
    }
    #chat-box {
        height: 200px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 5px;
        background: #fafafa;
        margin-bottom: 10px;
    }
    .mensaje {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
    }
    .mensaje img {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        margin-right: 5px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }
    table, th, td {
        border: 1px solid #aaa;
        padding: 5px;
        text-align: center;
    }
    canvas {
        background: lightblue;
        display: block;
        margin: 10px auto;
    }
    button {
        background-color: #1976d2;
        color: #fff;
        padding: 12px 28px;
        border: none;
        border-radius: 8px;
        font-size: 1.1em;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(21,101,192,0.2);
        transition: transform 0.2s, background 0.2s;
        margin: 5px;
        font-family: 'Comic Sans MS', Arial, sans-serif;
    }
    button:hover {
        background-color: #42a5f5;
        transform: scale(1.08) rotate(-2deg);
        box-shadow: 0 4px 16px rgba(33,150,243,0.3);
    }
    button:active {
        background-color: #0d47a1;
        transform: scale(0.96);
    }
</style>
</head>
<body>
<header>
    <img src="https://ebaldos199.github.io/mi-primera-pagina/foto_perfil.jpg" alt="Foto perfil">
    <span>Bienvenido a la Mini Comunidad</span>
</header>
<div class="container">
    <h2>¡Participa en la Comunidad!</h2>
    <button>💬 Chatea aquí</button>
    <button>🎮 Juega ahora</button>
    <button>👤 Cambia tu avatar</button>
    <!-- Puedes poner aquí el resto de tu contenido, chat, juego, tabla, etc. -->
</div>
</body>
</html>
